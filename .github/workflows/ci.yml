name: CI-CD - Python FastAPI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # BUILD & TEST
  # ============================================================
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: |
          PYTHONPATH=. pytest -v


  # ============================================================
  # SONARCLOUD
  #
  # Se ejecuta en:
  # - PUSH a develop
  # - PUSH a main
  # - PULL REQUEST hacia develop
  # - PULL REQUEST hacia main
  # ============================================================
  sonar:
    name: Análisis SonarCloud
    needs: test

    if: >
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main'))
      ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'develop' ||
        github.base_ref == 'main'))

    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # VALIDAR QUE GITHUB ESTÁ ENTREGANDO EL SECRET
      # --------------------------------------------------------
      - name: Verificar SONAR_TOKEN
        shell: bash
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "ERROR: SONAR_TOKEN no está disponible."
            echo "Verifica Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "OK: SONAR_TOKEN está disponible."
          fi

      # --------------------------------------------------------
      # ANÁLISIS SONARCLOUD
      # --------------------------------------------------------
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=camilomora90_devops-ci-cd-laboratorio
            -Dsonar.organization=camilomora90


  # ============================================================
  # DEPLOY AZURE CONTAINER APP
  #
  # SOLO se ejecuta cuando hay PUSH a develop.
  # Los Pull Request NO hacen deploy.
  # main NO hace deploy.
  # ============================================================
  deploy:
    name: Build and Deploy
    needs: test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # LOGIN AZURE
      # --------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPCICDFUNDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPCICDFUNDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPCICDFUNDEV_AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # BUILD & DEPLOY CONTAINER APP
      # --------------------------------------------------------
      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: acrfundev
          containerAppName: app-cicdfundev
          resourceGroup: rg-cicddevopsfun
          imageToBuild: acrfundev.azurecr.io/app-cicdfundev:${{ github.sha }}
 
