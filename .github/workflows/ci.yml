name: CI-CD - Python FastAPI

on:
  push:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # BUILD & TEST
  # ============================================================
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: |
          pytest -v


  # ============================================================
  # SONARCLOUD
  # Solo se ejecuta cuando el código llega a main
  # ============================================================
  sonar:
    name: Análisis SonarCloud
    needs: test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # PRUEBA TEMPORAL DEL TOKEN
      # No muestra el token
      # ----------------------------------------------------------
      - name: Verificar SONAR_TOKEN
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "❌ SONAR_TOKEN NO está disponible"
            exit 1
          else
            echo "✅ SONAR_TOKEN está disponible"
          fi

      # ----------------------------------------------------------
      # SONARCLOUD
      # ----------------------------------------------------------
      - name: Análisis SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io


  # ============================================================
  # BUILD & DEPLOY
  # Solo se ejecuta en main después de SonarCloud
  # ============================================================
  deploy:
    name: Build and Deploy
    needs: sonar

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # LOGIN AZURE
      # ----------------------------------------------------------
      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPCICDFUNDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPCICDFUNDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPCICDFUNDEV_AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # DEPLOY AZURE CONTAINER APPS
      # ----------------------------------------------------------
      - name: Build and Deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: acrfundev
          containerAppName: app-cicdfundev
          resourceGroup: rg-cicdfundev
          imageToBuild: acrfundev.azurecr.io/app-cicdfundev:${{ github.sha }}

      # ----------------------------------------------------------
      # LOGOUT AZURE
      # ----------------------------------------------------------
      - name: Logout Azure
        run: az logout
