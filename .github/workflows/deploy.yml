name: CD - Deploy FastAPI to Azure Container Apps

on:
  workflow_run:
    workflows:
      - "CI - Python FastAPI"
    types:
      - completed
    branches:
      - develop

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APPCICDFUNDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APPCICDFUNDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APPCICDFUNDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: acrfundev
          containerAppName: app-cicdfundev
          resourceGroup: rg-cicddevopsfun
          imageToBuild: acrfundev.azurecr.io/app-cicdfundev:${{ github.event.workflow_run.head_sha || github.sha }}
