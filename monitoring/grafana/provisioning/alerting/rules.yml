apiVersion: 1

groups:
  - orgId: 1
    name: FastAPI Alerts
    folder: FastAPI Alerts
    interval: 10s
    rules:
      - uid: high_latency_alert
        title: HighLatencyAlert
        condition: A
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: rate(http_request_duration_seconds_sum[1m]) / rate(http_request_duration_seconds_count[1m]) > 0.5
              instant: true
              refId: A
        noDataState: OK
        execErrState: OK

      - uid: high_error_rate_alert
        title: HighErrorRateAlert
        condition: A
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.01
              instant: true
              refId: A
        noDataState: OK
        execErrState: OK
